name: 验证自托管 Runner

# 触发条件：手动触发（可在 GitHub 仓库的 Actions 页面点击"Run workflow"）
on:
  workflow_dispatch:

jobs:
  test-runner:
    # 使用自托管 runner 的默认标签
    runs-on: self-hosted

    steps:
      - name: 打印 Runner 信息
        run: |
          echo "🎉 自托管 Runner 成功接收任务！"
          echo "Runner 名称: $RUNNER_NAME"  # 显示当前 runner 名称
          echo "系统信息: $(uname -a)"
          echo "当前时间: $(date)"

      - name: 测试基础命令
        run: |
          echo "测试目录列表："
          ls -la
          echo "测试网络连通性（GitHub）："
          ping -c 3 github.com